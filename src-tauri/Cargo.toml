[package]
name = "mesh-audio"
version = "0.1.0"
authors = ["monoAPO"]
edition = "2021"
description = "Equalizer APO Config Switcher rewritten in Tauri"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
hex = "0.4"
pathdiff = "0.2"
tauri = { version = "1.5", features = [
  "system-tray",
  "icon-ico",
  "icon-png"
] }
windows = { version = "0.54", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Storage_StructuredStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_UI",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Security",
  "implement"
] }

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
